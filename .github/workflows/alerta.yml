name: Alerta

on:
  push:
    branches: [main]

jobs:
  notificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar hola mundo
        run: node hola.js

      - name: Enviar notificacion a ntfy
        run: curl -d "Nuevo push en ${{ github.repository }} por ${{ github.actor }}" ntfy.sh/devops-itla
